spring.application.name=ne-starter-template

# PostgreSQL for exam (see application-prod.properties)
# Password: src/main/resources/application-local.properties (copy from .example)
spring.profiles.active=prod
spring.config.import=optional:classpath:application-local.properties

# H2 for quick practice without Postgres: spring.profiles.active=dev

# JWT (change secret on exam day)
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS
app.jwt.expiration-ms=86400000

# OTP
app.otp.length=6
app.otp.expiry-minutes=10

# Mail (Gmail example — use app password)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=your-email@gmail.com

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.gemimah.nestartertemplate=DEBUG
logging.level.org.springframework.security=INFO
